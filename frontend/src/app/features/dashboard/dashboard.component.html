<main class="dashboard-page">
  <header class="dashboard-header">
    <span class="dashboard-brand">SecurePortal</span>
    <button type="button" class="logout-button" (click)="logout()">
      Cerrar sesi&oacute;n
    </button>
  </header>
  <section class="dashboard-content container py-4">
    <nav class="nav nav-pills mb-4" aria-label="Navegaci&oacute;n del cat&aacute;logo">
      <button type="button" class="nav-link" [class.active]="selectedView() === 'products'"
          [attr.aria-current]="selectedView() === 'products' ? 'page' : null" aria-controls="products-panel"
          (click)="selectView('products')">
        Productos
      </button>
      <button type="button" class="nav-link" [class.active]="selectedView() === 'audit'"
          [attr.aria-current]="selectedView() === 'audit' ? 'page' : null" aria-controls="audit-panel"
          (click)="selectView('audit')">
        Auditor&iacute;a de transacciones
      </button>
    </nav>
    <section id="products-panel" aria-labelledby="products-heading" [hidden]="selectedView() !== 'products'">
      <app-product-catalog></app-product-catalog>
    </section>
    <section id="audit-panel" aria-labelledby="audit-heading" [hidden]="selectedView() !== 'audit'">
      <app-audit-log-page [refreshKey]="auditRefreshKey()"></app-audit-log-page>
    </section>
  </section>
</main>
