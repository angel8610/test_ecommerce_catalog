spring:
  application:
    name: ecommerce_catalog
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false

security:
  jwt:
    issuer: "ecommerce-api"
    expiration: 900
    secret: ${JWT_SECRET}

external:
  api:
    fake-store:
      url: ${API_FAKE_STORE_URL}
